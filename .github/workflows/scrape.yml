name: FundLens Data Source Health Check

# The app fetches + caches data itself (see data_store.py / APScheduler in main.py).
# This monthly job just verifies the upstream source (mfdata.in) still returns data.
on:
  schedule:
    - cron: '0 5 12 * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify mfdata.in returns real holdings
        run: python scraper.py
